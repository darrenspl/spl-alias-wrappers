# Runs both test suites on real Linux, macOS and Windows machines on every push.
name: test

on:
  push:
  pull_request:

jobs:
  bash:
    name: bash test.sh on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows runs this in Git Bash. macOS runs the zsh checks as well.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run test.sh
        shell: bash
        run: bash test.sh

  powershell:
    name: PowerShell 7 test.ps1 on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run test.ps1
        shell: pwsh
        run: ./test.ps1

  windows-powershell:
    name: Windows PowerShell 5.1 test.ps1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test.ps1
        shell: powershell
        run: .\test.ps1
